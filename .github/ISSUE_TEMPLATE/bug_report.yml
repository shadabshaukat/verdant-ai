name: Bug report
description: Report a reproducible problem in Verdant DBA.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Explain the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS/architecture, Node, Docker/Compose, commit and bundled/external Ollama mode.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove credentials, private SQL and personal information before posting.
