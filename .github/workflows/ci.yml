name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Portable setup and help
        run: |
          node scripts/verdant.mjs setup --ollama=bundled
          node scripts/verdant.mjs --help

  compose-smoke:
    name: Fresh Linux deployment and upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: verdant-ci
      OLLAMA_MODE: external
      OLLAMA_URL: http://host.docker.internal:11434
      APP_PORT: 8090
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/verdant.mjs setup --ollama=external
      - name: Match private secret ownership on Linux
        run: |
          echo "APP_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "APP_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Validate both deployment definitions
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.ollama.yaml --profile ollama config --quiet
          docker compose -f compose.yaml -f compose.production.yaml config --quiet
      - name: Start without model downloads
        run: docker compose up -d --build --wait
      - run: npm run integration
      - run: npm run integration:fleet
      - run: npm run integration:maintenance
      - name: Reapply migrations without replaying history
        run: node scripts/verdant.mjs migrate
      - name: Diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop the isolated CI project
        if: always()
        run: docker compose down --volumes --remove-orphans
