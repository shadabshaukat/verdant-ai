# Selected automatically by the portable CLI in bundled mode. CPU-only; no host GPU assumptions.
services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.11}
    profiles: [ollama]
    volumes: [ollama_models:/root/.ollama]
    networks: [frontend]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 5s
      timeout: 5s
      retries: 60
    restart: unless-stopped
  app:
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
    depends_on:
      ollama: { condition: service_healthy }
  worker:
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
    depends_on:
      ollama: { condition: service_healthy }
volumes:
  ollama_models:
